name: ClearCutt Verify
description: Install clearcutt-verify (a signature-verified release binary) and cosign, to verify an image estate in CI.
branding:
  icon: check-circle
  color: green
inputs:
  version:
    description: >-
      Release to install (vX.Y.Z or latest). Default: the release this action
      is pinned to, by its tag or by the commit SHA a release tag points at
      (a SHA no release tag points at fails), else latest. `source` builds
      the action's own checkout instead.
    required: false
    default: ""
outputs:
  path:
    description: Path of the installed clearcutt-verify binary.
    value: ${{ steps.install.outputs.path }}
runs:
  using: composite
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        # The installer's default is v3.0.6, which, when it can't fetch
        # Sigstore's trusted root, only warns and then fails bundle
        # verification with a message that reads as a bad signature;
        # v3.1.1 and later report the TUF error itself.
        cosign-release: v3.1.4

    - name: Pick the version
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        v="$INPUT_VERSION"
        if [[ -z "$v" ]]; then
          if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            v="$ACTION_REF"
          elif [[ "$ACTION_REF" =~ ^[0-9a-f]{40}$ ]]; then
            # Pinned by commit: install the release tagged at that commit,
            # never whatever release is latest.
            v=$(git ls-remote --tags https://github.com/northcutted/clearcutt-verify \
              | awk -v sha="$ACTION_REF" '$1 == sha { sub("^refs/tags/", "", $2); sub("[\\^][{][}]$", "", $2); print $2 }' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1 || true)
            if [[ -z "$v" ]]; then
              echo "::error::clearcutt-verify is pinned to commit $ACTION_REF, which no release tag points at; set version: vX.Y.Z (or source, to build that commit)"
              exit 1
            fi
            v="v$v"
          else
            v=latest
          fi
        fi
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - name: Set up Go (source builds)
      if: steps.version.outputs.version == 'source'
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: ${{ github.action_path }}/cli/go.mod
        cache: false

    - name: Install clearcutt-verify
      id: install
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/clearcutt-verify-bin"
        mkdir -p "$bin"
        if [[ "$VERSION" == source ]]; then
          go build -C "$ACTION_PATH/cli" -trimpath -o "$bin/clearcutt-verify" ./cmd/clearcutt-verify
        else
          repo=northcutted/clearcutt-verify
          if [[ "$VERSION" == latest ]]; then base="https://github.com/$repo/releases/latest/download"; else base="https://github.com/$repo/releases/download/$VERSION"; fi
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          asset="clearcutt-verify-$os-$arch"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$asset" "$base/$asset"
          curl -fsSL -o "$asset.sig" "$base/$asset.sig"
          curl -fsSL -o SHA256SUMS.txt "$base/SHA256SUMS.txt"
          grep -E "  $asset$" SHA256SUMS.txt | sha256sum -c -
          cosign verify-blob "$asset" --bundle "$asset.sig" \
            --certificate-identity-regexp '^https://github\.com/northcutted/clearcutt-verify/\.github/workflows/release\.yml@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          install -m 0755 "$asset" "$bin/clearcutt-verify"
        fi
        echo "$bin" >> "$GITHUB_PATH"
        echo "path=$bin/clearcutt-verify" >> "$GITHUB_OUTPUT"
        "$bin/clearcutt-verify" --version
