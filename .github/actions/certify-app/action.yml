name: 'ClearCutt App Certification'
description: 'Certify a downstream application container image against platform security contracts'
inputs:
  image:
    description: 'The target OCI image reference to certify (e.g. ghcr.io/acme/my-app:latest)'
    required: true
  policy:
    description: 'Path to declarative certification-policy.yaml governance file'
    required: true
  base:
    description: 'Expected ClearCutt base image ID (e.g. java21-distroless or python3.14-slim)'
    required: true
  clearcutt-version:
    description: 'ClearCutt CLI release tag to download (e.g. v0.17.0). Pin this for reproducible builds.'
    required: false
    default: 'v0.17.0'
  certificate-identity-regexp:
    description: >-
      Regexp for the Sigstore signing identity the app image must be signed by (the
      workflow that built and signed it). Required when the policy requires signature,
      provenance, or SBOM verification. A wildcard ('.*') or empty value is refused,
      because it would accept any valid Sigstore certificate from anyone.
    required: false
    default: ''
  certificate-oidc-issuer:
    description: 'Expected OIDC issuer for keyless verification.'
    required: false
    default: 'https://token.actions.githubusercontent.com'

runs:
  using: "composite"
  steps:
    - name: Install Sigstore Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Install ClearCutt CLI
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.clearcutt-version }}"
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m | sed 's/x86_64/amd64/' | sed 's/aarch64/arm64/')
        ASSET="clearcutt-verify-${OS}-${ARCH}"
        BASE_URL="https://github.com/${{ github.action_repository }}/releases/download/${VERSION}"
        # Releases from before the rename to ClearCutt Verify name the binary
        # clearcutt-<os>-<arch> and were signed under the repository's old name.
        OWNER="$(echo "${{ github.action_repository }}" | cut -d/ -f1)"
        SIGNING_IDENTITY_RE="^https://github\\.com/${OWNER}/(clearcutt|clearcutt-verify)/\\.github/workflows/release\\.yml@refs/heads/main$"
        echo "[clearcutt-verify] Downloading ${ASSET} (${VERSION})..."
        if ! curl -fsSL -o "${RUNNER_TEMP}/${ASSET}" "${BASE_URL}/${ASSET}" 2>/dev/null; then
          ASSET="clearcutt-${OS}-${ARCH}"
          curl -fsSL -o "${RUNNER_TEMP}/${ASSET}" "${BASE_URL}/${ASSET}"
        fi
        curl -fsSL -o "${RUNNER_TEMP}/${ASSET}.sig" "${BASE_URL}/${ASSET}.sig"
        curl -fsSL -o "${RUNNER_TEMP}/SHA256SUMS.txt" "${BASE_URL}/SHA256SUMS.txt"
        (
          cd "${RUNNER_TEMP}"
          grep -E "  ${ASSET}$" SHA256SUMS.txt | sha256sum -c -
        )
        cosign verify-blob "${RUNNER_TEMP}/${ASSET}" \
          --bundle "${RUNNER_TEMP}/${ASSET}.sig" \
          --certificate-identity-regexp "${SIGNING_IDENTITY_RE}" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
        install -m 0755 "${RUNNER_TEMP}/${ASSET}" "${RUNNER_TEMP}/clearcutt-verify"
        echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
        "${RUNNER_TEMP}/clearcutt-verify" --version

    - name: Pull Target Application Image
      shell: bash
      run: |
        echo "[clearcutt] Pulling downstream image reference: ${{ inputs.image }}..."
        docker pull ${{ inputs.image }}

    - name: Unpack Image Tarball Workspace
      shell: bash
      run: |
        echo "[clearcutt] Saving image to offline tarball representation..."
        docker save ${{ inputs.image }} -o /tmp/clearcutt-app-image.tar

    - name: Execute Security Compliance Certification Audits
      shell: bash
      run: |
        echo "[clearcutt] Running offline certification checks..."
        clearcutt-verify certify /tmp/clearcutt-app-image.tar \
          --policy ${{ inputs.policy }} \
          --base ${{ inputs.base }} \
          --image-ref ${{ inputs.image }} \
          --format json > /tmp/certification-report.json
        cat /tmp/certification-report.json

    - name: Registry-Side Attestation & Trust Verification
      shell: bash
      run: |
        set -euo pipefail
        # Parse the (flat) policy requirements. These are registry-side referrers,
        # so they are verified here against the live registry rather than offline.
        POLICY_FILE="${{ inputs.policy }}"
        if [ ! -f "$POLICY_FILE" ]; then
          echo "[clearcutt] Policy file not found at $POLICY_FILE!"
          exit 1
        fi

        REQ_SIG=$(grep -E 'requireSignature:' "$POLICY_FILE" | awk '{print $2}' | tr -d ' "' || echo "false")
        REQ_PROV=$(grep -E 'requireProvenance:' "$POLICY_FILE" | awk '{print $2}' | tr -d ' "' || echo "false")
        REQ_SBOM=$(grep -E 'requireSbom:' "$POLICY_FILE" | awk '{print $2}' | tr -d ' "' || echo "false")
        echo "[clearcutt] Supply chain policy requirements: requireSignature=$REQ_SIG, requireProvenance=$REQ_PROV, requireSbom=$REQ_SBOM"

        IDENTITY="${{ inputs.certificate-identity-regexp }}"
        ISSUER="${{ inputs.certificate-oidc-issuer }}"

        # Refuse to "verify" against a wildcard/empty signer identity — doing so
        # accepts any valid Sigstore certificate and gives a false sense of trust.
        if [ "$REQ_SIG" = "true" ] || [ "$REQ_PROV" = "true" ] || [ "$REQ_SBOM" = "true" ]; then
          if [ -z "$IDENTITY" ] || [ "$IDENTITY" = ".*" ]; then
            echo "[clearcutt] ✘ FAIL: policy requires attestation verification but no trusted signer identity was provided."
            echo "            Set the 'certificate-identity-regexp' input to the workflow identity that signed the image (wildcards are refused)."
            exit 1
          fi
        fi

        # Run registry-side signature verification if requested by policy
        if [ "$REQ_SIG" = "true" ]; then
          echo "[clearcutt] Policy requires a cryptographic signature. Verifying against $IDENTITY..."
          cosign verify "${{ inputs.image }}" \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" >/dev/null || {
              echo "[clearcutt] ✘ FAIL: Registry signature verification failed!"
              exit 1
            }
          echo "[clearcutt] ✔ PASS: Cryptographic signature VERIFIED for $IDENTITY."
        fi

        # Run registry-side provenance verification if requested by policy
        if [ "$REQ_PROV" = "true" ]; then
          echo "[clearcutt] Policy requires SLSA build provenance. Verifying against $IDENTITY..."
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "${{ inputs.image }}" >/dev/null || {
              echo "[clearcutt] ✘ FAIL: SLSA build provenance attestation verification failed!"
              exit 1
            }
          echo "[clearcutt] ✔ PASS: SLSA Build Provenance attestation VERIFIED."
        fi

        # Run registry-side SBOM verification if requested by policy
        if [ "$REQ_SBOM" = "true" ]; then
          echo "[clearcutt] Policy requires an SPDX SBOM. Verifying against $IDENTITY..."
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "${{ inputs.image }}" >/dev/null || {
              echo "[clearcutt] ✘ FAIL: SPDX SBOM attestation verification failed!"
              exit 1
            }
          echo "[clearcutt] ✔ PASS: SPDX SBOM attestation VERIFIED."
        fi

    - name: Upload Compliance Certification Evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: clearcutt-certification-report
        path: /tmp/certification-report.json
