name: Install ClearCutt Verify
description: Install a verified clearcutt-verify release binary or build the checked-out source for development.
inputs:
  mode:
    description: "'release' installs a verified release asset; 'local' builds from ./cli."
    required: false
    default: release
  version:
    description: clearcutt-verify release tag to install when mode=release.
    required: false
    default: latest
  repo:
    description: GitHub repository that publishes clearcutt-verify release assets.
    required: false
    default: northcutted/clearcutt-verify
  output:
    description: Output path for the installed binary.
    required: false
    default: ./clearcutt-verify
  go-version-file:
    description: go.mod path for local source builds.
    required: false
    default: cli/go.mod
  go-cache-dependency-path:
    description: go.sum path for local source build cache keys.
    required: false
    default: cli/go.sum
runs:
  using: composite
  steps:
    - name: Install Sigstore Cosign
      if: ${{ inputs.mode != 'local' }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Install verified release binary
      if: ${{ inputs.mode != 'local' }}
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        REPO="${{ inputs.repo }}"
        OUTPUT="${{ inputs.output }}"
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m | sed 's/x86_64/amd64/' | sed 's/aarch64/arm64/')
        ASSET="clearcutt-verify-${OS}-${ARCH}"
        if [[ "${VERSION}" == "latest" ]]; then
          BASE_URL="https://github.com/${REPO}/releases/latest/download"
        else
          BASE_URL="https://github.com/${REPO}/releases/download/${VERSION}"
        fi
        # Releases from before the rename to ClearCutt Verify name the binary
        # clearcutt-<os>-<arch> and were signed by northcutted/clearcutt's
        # release workflow (the same repository, under its old name).
        OWNER="${REPO%%/*}"
        NAME="${REPO#*/}"
        case "${NAME}" in
          clearcutt | clearcutt-verify) NAMES="(clearcutt|clearcutt-verify)" ;;
          *) NAMES="${NAME//./\\.}" ;;
        esac
        SIGNING_IDENTITY_RE="^https://github\\.com/${OWNER}/${NAMES}/\\.github/workflows/release\\.yml@refs/heads/main$"
        mkdir -p "$(dirname "${OUTPUT}")"
        if ! curl -fsSL -o "${RUNNER_TEMP}/${ASSET}" "${BASE_URL}/${ASSET}" 2>/dev/null; then
          ASSET="clearcutt-${OS}-${ARCH}"
          curl -fsSL -o "${RUNNER_TEMP}/${ASSET}" "${BASE_URL}/${ASSET}"
        fi
        echo "[clearcutt-verify] Installing verified ${ASSET} from ${REPO}@${VERSION}"
        curl -fsSL -o "${RUNNER_TEMP}/${ASSET}.sig" "${BASE_URL}/${ASSET}.sig"
        curl -fsSL -o "${RUNNER_TEMP}/SHA256SUMS.txt" "${BASE_URL}/SHA256SUMS.txt"
        (
          cd "${RUNNER_TEMP}"
          grep -E "  ${ASSET}$" SHA256SUMS.txt | sha256sum -c -
        )
        cosign verify-blob "${RUNNER_TEMP}/${ASSET}" \
          --bundle "${RUNNER_TEMP}/${ASSET}.sig" \
          --certificate-identity-regexp "${SIGNING_IDENTITY_RE}" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
        install -m 0755 "${RUNNER_TEMP}/${ASSET}" "${OUTPUT}"
        "${OUTPUT}" --version
        if [[ -n "${GITHUB_PATH:-}" ]]; then
          output_dir="$(cd "$(dirname "${OUTPUT}")" && pwd)"
          echo "${output_dir}" >> "${GITHUB_PATH}"
        fi

    - name: Setup Go
      if: ${{ inputs.mode == 'local' }}
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache-dependency-path: ${{ inputs.go-cache-dependency-path }}
        cache: true

    - name: Build local source binary
      if: ${{ inputs.mode == 'local' }}
      shell: bash
      run: |
        set -euo pipefail
        OUTPUT="${{ inputs.output }}"
        case "${OUTPUT}" in
          /*) BUILD_OUTPUT="${OUTPUT}" ;;
          ./*) BUILD_OUTPUT="../${OUTPUT#./}" ;;
          *) BUILD_OUTPUT="../${OUTPUT}" ;;
        esac
        VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
        mkdir -p "$(dirname "${OUTPUT}")"
        cd cli
        go build \
          -ldflags="-s -w -X github.com/northcutted/clearcutt-verify/internal/commands.Version=${VERSION}" \
          -o "${BUILD_OUTPUT}" ./cmd/clearcutt-verify
        cd ..
        "${OUTPUT}" --version
        if [[ -n "${GITHUB_PATH:-}" ]]; then
          output_dir="$(cd "$(dirname "${OUTPUT}")" && pwd)"
          echo "${output_dir}" >> "${GITHUB_PATH}"
        fi
