# ClearCutt Verify pull request gate

name: ClearCutt Verify PR Gating

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write # Allows the ClearCutt build gate to report pass/fail status back to the SCM

# Cancel superseded PR runs — the latest push is the only one anyone cares about.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Surfaces
    runs-on: ubuntu-latest
    outputs:
      go: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.go }}
      # The keyless e2e signs with the job's OIDC identity, which pull
      # requests from forks don't get.
      keyless: ${{ (github.event_name == 'workflow_dispatch' || steps.filter.outputs.go == 'true') && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify changed paths
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - 'AGENTS.md'
              - 'action.yml'
              - 'README.md'
              - 'Makefile'
              - 'docs/**'
              - 'contract/**'
              - 'examples/**'
              - 'scripts/**'
              - 'cli/**'
              - '.agents/**'
              - '.github/workflows/**'
              - '.github/zizmor.yml'
              - '.github/dependabot.yml'
              - '.github/copilot-instructions.md'

  go-ci:
    name: Go Lint, Build, Test & Drift Guard
    needs: [changes]
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Go Vet
        working-directory: cli
        run: go vet ./...

      - name: Go Build
        run: make cli-build

      - name: Install Through The Action (Source Build)
        uses: ./
        with:
          version: source

      - name: Check The Action's Binary
        run: clearcutt-verify estate verify --help >/dev/null

      - name: Imported Fleet Offline Demo
        run: CLEARCUTT="$PWD/clearcutt-verify" ./scripts/demo-imported-fleet-offline.sh

      - name: Validate Documented Commands
        run: ./scripts/validate-doc-commands.sh ./clearcutt-verify

      - name: Go Test with Coverage
        working-directory: cli
        env:
          COVERAGE_MIN: "85.0"
        run: ./scripts/go-coverage.sh

      - name: Upload Go Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: |
            cli/coverage.out
            cli/coverage.txt
            cli/coverage-packages.txt
            cli/coverage-low-functions.txt
            cli/coverage.html
          retention-days: 14
          if-no-files-found: error

  # Build runs images concurrently (estate verify --concurrency), so the
  # tests run under the race detector too.
  go-race:
    name: Go Race Detector
    needs: [changes]
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Go Test With The Race Detector
        working-directory: cli
        run: go test -race -count=1 ./...

  # Pinned versions, fetched through the Go module proxy and checked against
  # the checksum database (go run pkg@version); they don't enter go.mod.
  staticcheck:
    name: Staticcheck
    needs: [changes]
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Staticcheck
        working-directory: cli
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  # Known vulnerabilities in the code paths the CLI calls, its dependencies'
  # and the Go standard library's (of the toolchain go.mod selects, which the
  # release builds with too).
  govulncheck:
    name: Govulncheck
    needs: [changes]
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Govulncheck
        working-directory: cli
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The workflows and the action, linted like code. Findings this repository
  # keeps, and why, are in .github/zizmor.yml.
  zizmor:
    name: Zizmor (Workflow Audit)
    needs: [changes]
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          config: .github/zizmor.yml
          advanced-security: false

  # The source build in go-ci covers the action's `version: source` path; this
  # covers the default, which downloads the latest release and checks its
  # checksum and Sigstore bundle, on the platforms users run it on.
  action-install:
    name: Install The Latest Release Through The Action (${{ matrix.os }})
    needs: [changes]
    if: ${{ needs.changes.outputs.go == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Through The Action (Default)
        id: install
        uses: ./

      - name: Check The Installed Release
        env:
          BIN: ${{ steps.install.outputs.path }}
        run: |
          "$BIN" --version
          clearcutt-verify estate verify --help >/dev/null

  # Every other test fakes cosign. This job signs and attests images with the
  # real cosign the action installs, in a real registry, and checks what
  # estate verify and estate pull make of them (a wrong signer included), so
  # a change in cosign's bundle format or output can't pass unnoticed.
  # registry:2 has no Referrers API (cosign and clearcutt-verify use the
  # referrers tag); registry:3 has one. Evidence is stored both as Sigstore
  # bundles and as cosign v2's .sig/.att tags. It signs with key pairs and no
  # transparency log: no OIDC token and no network beyond the registry, so
  # pull requests from forks run it too. The registry:3 leg also rescans the
  # verified SBOMs with grype (which downloads its database) and keeps its
  # bundle for the portal contract gate.
  cosign-e2e:
    name: Real-Cosign End-To-End (${{ matrix.name }})
    needs: [changes]
    if: ${{ needs.changes.outputs.go == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: registry 2, referrers tag
            slug: registry2
            image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
            rescan: ""
          - name: registry 3, Referrers API
            slug: registry3
            image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
            rescan: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      registry:
        image: ${{ matrix.image }}
        ports:
          - 5000:5000
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      # The cosign users get: the one the action installs.
      - name: Install cosign Through The Action
        uses: ./
        with:
          version: source

      # A pinned release, checked against its published checksum (no
      # curl | sh), for --rescan.
      - name: Install grype (pinned, checksum-verified)
        if: ${{ matrix.rescan != '' }}
        env:
          GRYPE_VERSION: "0.120.1"
          GRYPE_SHA256: 0a9ee97ef5ae2ee953b0a80098105052e846cdbe319a57d808b519c33cd1343d
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/grype"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/grype.tar.gz" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  $dir/grype.tar.gz" | sha256sum -c -
          tar -xzf "$dir/grype.tar.gz" -C "$dir" grype
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/grype" version

      - name: Install Notation (pinned, checksum-verified)
        env:
          NOTATION_VERSION: "1.3.2"
          NOTATION_SHA256: e1a0f060308086bf8020b2d31defb7c5348f133ca0dba6a1a7820ef3cbb6dfe5
        run: |
          set -euo pipefail
          notation_dir="$RUNNER_TEMP/notation"
          mkdir -p "$notation_dir"
          curl -fsSL --retry 3 -o "$notation_dir/notation.tar.gz" \
            "https://github.com/notaryproject/notation/releases/download/v${NOTATION_VERSION}/notation_${NOTATION_VERSION}_linux_amd64.tar.gz"
          echo "${NOTATION_SHA256}  $notation_dir/notation.tar.gz" | sha256sum -c -
          tar -xzf "$notation_dir/notation.tar.gz" -C "$notation_dir" notation
          "$notation_dir/notation" version

      - name: Sign, Attest, And Verify With Real Cosign And Notation
        working-directory: cli
        env:
          CLEARCUTT_E2E_REGISTRY: localhost:5000
          CLEARCUTT_E2E_RESCAN: ${{ matrix.rescan }}
          CLEARCUTT_E2E_BUNDLE_OUT: ${{ runner.temp }}/e2e-bundle
          CLEARCUTT_E2E_NOTATION: ${{ runner.temp }}/notation/notation
        run: go test -count=1 -timeout 10m -run '^(TestRealCosign|TestRealNotation)$' -v ./internal/commands

      - name: Keep The Bundle For The Portal Contract Gate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-bundle-${{ matrix.slug }}
          path: ${{ runner.temp }}/e2e-bundle
          retention-days: 7
          if-no-files-found: error

  # The same test, also signing keylessly with the job's own OIDC identity
  # against the public Sigstore: the real Fulcio, Rekor, and TUF, and the
  # trusted-root fetch that failed one attestation a day on the showcase.
  # Needs id-token, which forks' pull requests don't get (skipped then).
  cosign-keyless-e2e:
    name: Real-Cosign End-To-End (keyless, public Sigstore)
    needs: [changes]
    if: ${{ needs.changes.outputs.keyless == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    services:
      registry:
        image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5000:5000
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Install cosign Through The Action
        uses: ./
        with:
          version: source

      - name: Sign Keylessly, Then Verify
        working-directory: cli
        env:
          CLEARCUTT_E2E_REGISTRY: localhost:5000
          CLEARCUTT_E2E_KEYLESS: "1"
        run: go test -count=1 -timeout 10m -run '^TestRealCosign$' -v ./internal/commands

  # The contract gate (Phase D): a released clearcutt-portal must still read
  # what this clearcutt-verify writes. It builds the site from the fresh
  # bundle the e2e wrote (new fields included) and from the previous
  # release's fixture, so a breaking contract change fails here rather than
  # in the portal a week later. Pinned to clearcutt-portal's main by commit:
  # the documented invocation (and its warnings for unknown fields) landed
  # after v0.1.0; move the pin to the next release's commit when it ships.
  portal-contract:
    name: Portal Contract Gate
    needs: [changes, cosign-e2e]
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fresh Bundle From The Real-Cosign e2e
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-bundle-registry3
          path: ${{ runner.temp }}/fresh-bundle

      - name: The Previous Release's Fixture
        env:
          PREVIOUS: v0.16.0
          OUT: ${{ runner.temp }}/previous-bundle
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          for f in estate-report.json estate-history.json; do
            git show "$PREVIOUS:contract/fixtures/northcutted-images/$f" > "$OUT/$f"
          done
          ls -l "$OUT"

      - name: Portal Builds The Fresh Bundle
        uses: northcutted/clearcutt-portal@b183f2ee027a3214bb60e84c089b574d7093e446 # main (after v0.1.0)
        with:
          bundle: ${{ runner.temp }}/fresh-bundle
          output: ${{ runner.temp }}/fresh-site

      - name: Portal Builds The Previous Release's Fixture
        uses: northcutted/clearcutt-portal@b183f2ee027a3214bb60e84c089b574d7093e446 # main (after v0.1.0)
        with:
          bundle: ${{ runner.temp }}/previous-bundle
          output: ${{ runner.temp }}/previous-site

  pr-gate-summary:
    name: PR Gate Summary
    needs:
      - changes
      - go-ci
      - go-race
      - staticcheck
      - govulncheck
      - zizmor
      - action-install
      - cosign-e2e
      - cosign-keyless-e2e
      - portal-contract
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize required gate jobs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pr-gate-summary.py" <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          changes = needs.get("changes", {})
          outputs = changes.get("outputs") or {}

          def enabled(name):
              return str(outputs.get(name, "")).lower() == "true"

          selected = {
              "go-ci": enabled("go"),
              "go-race": enabled("go"),
              "staticcheck": enabled("go"),
              "govulncheck": enabled("go"),
              "zizmor": enabled("go"),
              "action-install": enabled("go"),
              "cosign-e2e": enabled("go"),
              "cosign-keyless-e2e": enabled("keyless"),
              "portal-contract": enabled("go"),
          }

          lines = [
              "# PR Gate Summary",
              "",
              "## Path Filters",
              "",
              "| Surface | Selected |",
              "| --- | --- |",
          ]
          for name in ["go", "keyless"]:
              lines.append(f"| `{name}` | `{enabled(name)}` |")

          lines.extend([
              "",
              "## Job Results",
              "",
              "| Job | Expected | Result |",
              "| --- | --- | --- |",
          ])

          failures = []
          changes_result = changes.get("result")
          lines.append(f"| `changes` | `success` | `{changes_result}` |")
          if changes_result != "success":
              failures.append(f"changes={changes_result}")

          # Drift guard, both directions. A contract entry with no `needs` entry
          # means the job was deleted or renamed and the contract was not
          # updated; a `needs` job absent from the contract runs unchecked.
          for name in selected:
              if name not in needs:
                  failures.append(f"{name} is in the contract but not in `needs` (deleted or renamed job?)")
          for name in needs:
              if name != "changes" and name not in selected:
                  failures.append(f"{name} is in `needs` but not in the contract (its result is unchecked)")

          for name, is_selected in selected.items():
              if name not in needs:
                  continue
              result = (needs.get(name) or {}).get("result")
              expected = "success" if is_selected else "skipped"
              lines.append(f"| `{name}` | `{expected}` | `{result}` |")
              if is_selected and result != "success":
                  failures.append(f"{name}={result} (selected)")
              elif not is_selected and result in {"failure", "cancelled"}:
                  failures.append(f"{name}={result} (not selected)")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("\n".join(lines) + "\n")
          else:
              print("\n".join(lines))

          if failures:
              print("Required PR gate contract failed:", ", ".join(failures), file=sys.stderr)
              sys.exit(1)
          PY
          python3 "$RUNNER_TEMP/pr-gate-summary.py"
