# Build and deploy the ClearCutt catalog site to GitHub Pages.

name: ClearCutt Catalog Site

on:
  workflow_dispatch:
    inputs:
      release_limit:
        description: "How many recent releases to ingest"
        required: false
        default: "10"
      force_refresh_all:
        description: "Ignore the cache and re-fetch enrichment + SBOMs for every release (slow; use when schema changes or attestations are re-attached)"
        required: false
        default: "false"
        type: boolean
  # Rebuild nightly so CVE / vulnerability data stays fresh as the Grype DB
  # picks up newly-disclosed advisories against pinned package versions in
  # the SBOMs. 06:00 UTC keeps it off the GHA peak hours.
  schedule:
    - cron: "0 6 * * *"
  workflow_call:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gather:
    name: Gather catalog data
    runs-on: ubuntu-latest
    outputs:
      release-limit: ${{ steps.params.outputs.limit }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so `git describe --tags` resolves the release tag the
          # generator version is stamped from.
          fetch-depth: 0

      - name: Install ClearCutt CLI
        uses: ./.github/actions/install-clearcutt-verify
        with:
          mode: ${{ vars.CLEARCUTT_CLI_MODE || 'release' }}
          version: ${{ vars.CLEARCUTT_CLI_VERSION || 'v0.17.0' }}
          repo: ${{ vars.CLEARCUTT_CLI_REPO || 'northcutted/clearcutt-verify' }}

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin cosign v3 so catalog enrichment reads the same bundle format
          # produced by the release workflow.
          cosign-release: 'v3.0.6'

      # Reads the registry host from the ClearCutt config rather than assuming
      # ghcr.io, so a fork pointing at ECR, Harbor or anything else still logs
      # in to the right place. This used to be `clearcutt-verify platform registry-env`,
      # which is gone with the rest of the fork-scaffolding kit.
      # Reads the registry host from the ClearCutt config rather than assuming
      # ghcr.io, so a fork pointing elsewhere still logs in to the right place.
      # This used to be `clearcutt-verify platform registry-env`, which is gone with
      # the rest of the fork-scaffolding kit.
      - name: Resolve registry settings
        id: registry
        env:
          CLEARCUTT_REGISTRY_USER: ${{ vars.CLEARCUTT_REGISTRY_USER }}
        run: |
          set -euo pipefail
          config=clearcutt.yaml
          [ -f "$config" ] || config=clearcutt.fleet.yaml
          host=$(awk '/^registry:/{inside=1; next} inside && /^  host:/{print $2; exit} /^[a-z]/{inside=0}' "$config")
          echo "host=${host:-ghcr.io}" >> "$GITHUB_OUTPUT"
          echo "username=${CLEARCUTT_REGISTRY_USER:-$GITHUB_ACTOR}" >> "$GITHUB_OUTPUT"

      - name: Authenticate registry client
        env:
          REGISTRY_HOST: ${{ steps.registry.outputs.host }}
          REGISTRY_USER: ${{ steps.registry.outputs.username }}
          REGISTRY_PASSWORD: ${{ secrets.CLEARCUTT_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin

      # Cache the per-release enrichment, SBOM downloads, and vulnerability
      # scan output. Old releases are immutable: once an image is published, its
      # manifest digests, layers, OCI labels, and cosign attestations never
      # change. The catalog gather + enrich commands refresh only the most recent tag
      # (controlled via FORCE_REFRESH_* env vars) and read everything older
      # straight off disk. Vulnerability JSON is cached so the scanner can
      # refresh a bounded recent window while preserving older catalog data.
      #
      # Cache key scheme: the run_id makes each saved entry immutable (GH
      # Actions cache keys can't be overwritten); restore-keys do a prefix
      # match so the most recent prior cache is restored. The script hash in
      # the prefix busts the cache on any data-layer schema change.
      - name: Restore catalog data cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            site/src/data/enrichment
            site/src/data/sboms
            site/src/data/vulnerabilities
          key: catalog-data-${{ runner.os }}-${{ hashFiles('cli/internal/commands/catalog*.go', 'cli/internal/commands/scan*.go', 'cli/internal/oci/*.go', 'cli/internal/sign/*.go', 'cli/internal/catalog/types.go', 'site/src/lib/catalog-schema.ts') }}-${{ github.run_id }}
          restore-keys: |
            catalog-data-${{ runner.os }}-${{ hashFiles('cli/internal/commands/catalog*.go', 'cli/internal/commands/scan*.go', 'cli/internal/oci/*.go', 'cli/internal/sign/*.go', 'cli/internal/catalog/types.go', 'site/src/lib/catalog-schema.ts') }}-
            catalog-data-${{ runner.os }}-

      - name: Resolve fleet catalog parameters
        id: params
        env:
          # Hoisted out of the run script so the GitHub templater never
          # expands untrusted dispatch inputs into shell code.
          INPUT_LIMIT: ${{ github.event.inputs.release_limit || '' }}
        run: ./clearcutt-verify catalog workflow-params --release-limit "$INPUT_LIMIT" --github-output "$GITHUB_OUTPUT"

      - name: Build catalog data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          RELEASE_LIMIT: ${{ steps.params.outputs.limit }}
          FORCE_REFRESH_ALL: ${{ github.event.inputs.force_refresh_all == 'true' && '1' || '0' }}
          SCAN_TAG_DEPTH: ${{ steps.params.outputs.scan_depth }}
          SCAN_UPDATE_DB: "1"
        run: ./clearcutt-verify catalog build --limit "$RELEASE_LIMIT" --core-dir core --update-db --include-services

      # Schema-validate the generated catalog (structural checks plus the
      # embedded JSON Schemas) before it is uploaded for the site build.
      - name: Validate generated catalog
        run: ./clearcutt-verify --catalog site/src/data/catalog catalog validate

      - name: Upload catalog artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-data
          path: |
            site/src/data/catalog
            site/src/data/enrichment
            site/src/data/vulnerabilities
          retention-days: 7

  build:
    name: Build static site
    runs-on: ubuntu-latest
    needs: gather
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so `git describe --tags` resolves the release tag the
          # generator version is stamped from.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Download catalog data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalog-data
          path: site/src/data

      - name: Install ClearCutt CLI
        uses: ./.github/actions/install-clearcutt-verify
        with:
          mode: ${{ vars.CLEARCUTT_CLI_MODE || 'release' }}
          version: ${{ vars.CLEARCUTT_CLI_VERSION || 'v0.17.0' }}
          repo: ${{ vars.CLEARCUTT_CLI_REPO || 'northcutted/clearcutt-verify' }}

      # The estate view renders `graph build` / `graph layers` output. It is
      # generated here against the live registry rather than committed, because
      # a committed scan goes stale the moment the fleet moves and would put
      # claims about deleted images on a public page. Every step is best-effort:
      # the pages treat a missing artifact as a first-class empty state, so a
      # scan failure degrades the site instead of breaking the daily publish.
      # The estate view renders `graph build` / `graph layers` output. It is
      # generated here against the live registry rather than committed, because
      # a committed scan goes stale the moment the fleet moves and would put
      # claims about deleted images on a public page. Every step is best-effort:
      # the pages treat a missing artifact as a first-class empty state, so a
      # scan failure degrades the site instead of breaking the daily publish.
      - name: Scan registry for the estate view
        continue-on-error: true
        env:
          GHCR_TOKEN: ${{ secrets.CLEARCUTT_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ vars.CLEARCUTT_REGISTRY_USER || github.actor }}
        run: |
          set -euo pipefail
          records=(site/src/data/catalog/images/*.json)
          if [ ! -e "${records[0]}" ]; then
            echo "no catalog image records; skipping estate view"
            exit 0
          fi
          # The catalog records carry the authoritative registry and repository
          # names, so a fork with a different imagePrefix or owner works without
          # any extra configuration here.
          registry_base="$(jq -r '.registry' "${records[@]}" | sort -u | head -n1)"
          host="${registry_base%%/*}"
          namespace="${registry_base#*/}"
          mapfile -t repos < <(jq -r '.imageName' "${records[@]}" | sort -u)
          echo "scanning ${#repos[@]} repositories under ${host}/${namespace}"

          args=()
          for repo in "${repos[@]}"; do args+=(--repository "$repo"); done
          mkdir -p dist/estate
          ./clearcutt-verify registry scan \
            --registry "$host" \
            --namespace "$namespace" \
            "${args[@]}" \
            --username "$REGISTRY_USER" --password-env GHCR_TOKEN \
            --max-tags 12 \
            --output dist/estate/images.yaml --force
          ./clearcutt-verify import observe \
            --images dist/estate/images.yaml --output dist/estate/observations.json
          ./clearcutt-verify graph build \
            --observations dist/estate/observations.json \
            --output dist/estate/graph.json --force
          ./clearcutt-verify graph layers \
            --observations dist/estate/observations.json \
            --output dist/estate/layers.json --force

      - name: Build catalog site
        env:
          # Hoisted out of the run script so the GitHub templater never
          # expands event payload fields into shell code.
          REPO_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Only pass the estate flags when the scan above actually produced the
          # artifacts; `catalog site build` errors on a --graph path that does
          # not exist, which is the right behaviour for an explicit flag.
          estate=()
          if [ -f dist/estate/graph.json ]; then estate+=(--graph dist/estate/graph.json); fi
          if [ -f dist/estate/layers.json ]; then estate+=(--layers dist/estate/layers.json); fi
          ./clearcutt-verify catalog site build \
            --catalog site/src/data/catalog \
            --template site \
            --output site/dist \
            --install --clean \
            --base-path "/${REPO_NAME}" \
            --site-url "https://${REPOSITORY_OWNER}.github.io" \
            --generate-vex \
            "${estate[@]+"${estate[@]}"}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
