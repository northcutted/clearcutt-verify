# ClearCutt Verify release: signed CLI binaries with build provenance.

name: ClearCutt Verify Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      custom_version:
        description: "Custom version tag to release (e.g. v1.0.0). If omitted, automatically calculated via conventional commits."
        required: false
        default: ""

permissions:
  contents: read
  actions: read

# The release identity is pinned to refs/heads/main (the install action and the
# documented cosign verify-blob commands require it), so dispatches from other
# refs are rejected before any release work starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version Bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-calc.outputs.version }}
      version_type: ${{ steps.version-calc.outputs.version_type }}
    steps:
      - name: Enforce main release identity
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::ClearCutt release identity is pinned to refs/heads/main. Dispatch releases from main."
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: versioning
        uses: paulhatch/semantic-version@79147b94804704a613626766998afe7b2bd0bb47 # v6.0.5
        with:
          tag_prefix: "v"
          major_pattern: "BREAKING CHANGE"
          minor_pattern: "feat"
          version_format: "${major}.${minor}.${patch}"

      - name: Resolve Version Output
        id: version-calc
        env:
          # Hoisted out of the run script so the GitHub templater never
          # expands untrusted context into shell code.
          CUSTOM_INPUT: ${{ github.event.inputs.custom_version }}
          CALC_VERSION: ${{ steps.versioning.outputs.version }}
          CALC_VERSION_TYPE: ${{ steps.versioning.outputs.version_type }}
        run: |
          set -euo pipefail
          if [ -n "$CUSTOM_INPUT" ]; then
            RAW_VERSION="${CUSTOM_INPUT#v}"
            VERSION_TYPE=custom
          else
            RAW_VERSION="$CALC_VERSION"
            VERSION_TYPE="$CALC_VERSION_TYPE"
          fi

          # Releases are stable semantic versions (X.Y.Z, no pre-release or
          # build suffix): the install action and the docs only know vX.Y.Z.
          if ! [[ "$RAW_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release version '$RAW_VERSION' is not a stable semantic version (X.Y.Z)."
            exit 1
          fi

          # Fail before the approval gate if the tag already names another
          # commit; release-gate checks again before tagging.
          HEAD_SHA="$(git rev-parse HEAD)"
          if TAGGED="$(git rev-parse -q --verify "refs/tags/v$RAW_VERSION^{commit}")" && [ "$TAGGED" != "$HEAD_SHA" ]; then
            echo "::error::Tag v$RAW_VERSION already names $TAGGED, not $HEAD_SHA. Release a new version instead."
            exit 1
          fi

          echo "version_type=$VERSION_TYPE" >> "$GITHUB_OUTPUT"
          echo "version=$RAW_VERSION" >> "$GITHUB_OUTPUT"

  release-gate:
    name: Staging Gate (Approve to Release v${{ needs.check-version.outputs.version }})
    needs: [check-version]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check-version.outputs.version_type != 'none' }}
    runs-on: ubuntu-latest
    environment: production # <-- Manual approval gate here!
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create and Push Git Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Hoisted out of the run script so the GitHub templater never
          # expands untrusted context into shell code.
          RAW_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION_TAG="v$RAW_VERSION"
          HEAD_SHA="$(git rev-parse HEAD)"

          # The binaries are built from this commit, and their signatures and
          # provenance name it. A tag that names another commit would publish
          # them under a release whose source is something else, so refuse;
          # a tag already on this commit is a re-run.
          if TAGGED="$(git rev-parse -q --verify "refs/tags/$VERSION_TAG^{commit}")"; then
            if [ "$TAGGED" != "$HEAD_SHA" ]; then
              echo "::error::Tag $VERSION_TAG already names $TAGGED, not $HEAD_SHA. Release a new version instead."
              exit 1
            fi
            echo "Tag $VERSION_TAG already names $HEAD_SHA."
          else
            echo "Release approved. Tagging $HEAD_SHA as $VERSION_TAG."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$VERSION_TAG" "$HEAD_SHA"
            git push origin "refs/tags/$VERSION_TAG"
          fi

  build-cli:
    name: Build & Sign Go CLI Binaries
    needs: [check-version, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign signing and the provenance attestation
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.check-version.outputs.version }}

      # release-gate checked the tag; check again in case it moved since.
      - name: Check The Tag Names This Run's Commit
        env:
          VERSION: v${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::$VERSION names $(git rev-parse HEAD), not $GITHUB_SHA, the commit this run releases."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      # Built with plain go build rather than a clearcutt subcommand. Releasing
      # a tool should not depend on that tool: a CLI that cannot build breaks
      # its own release, and the subcommand that used to do this lived in the
      # image-factory command group that no longer exists.
      - name: Build, Sign, and Checksum CLI Assets
        env:
          VERSION: v${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build-outputs
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="build-outputs/clearcutt-verify-${os}-${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go -C cli build \
              -trimpath \
              -ldflags "-s -w -buildid= -X github.com/northcutted/clearcutt-verify/internal/commands.Version=${VERSION}" \
              -o "../${out}" ./cmd/clearcutt-verify
            # cosign v3 writes a Sigstore bundle (signature and certificate);
            # the install action and README verify it as <binary>.sig.
            cosign sign-blob --yes "$out" --bundle "${out}.sig"
          done
          ( cd build-outputs && sha256sum clearcutt-verify-* > SHA256SUMS.txt )

      # SLSA build provenance for each binary (not its .sig bundle), signed
      # with this workflow's identity and stored with GitHub's attestations:
      # `gh attestation verify <binary> --repo northcutted/clearcutt-verify`.
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build-outputs/clearcutt-verify-*
            !build-outputs/*.sig

      - name: Upload CLI Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cli-binaries
          path: |
            build-outputs/clearcutt-verify-*
            build-outputs/SHA256SUMS.txt
          retention-days: 7

  finalize-release:
    name: Finalize GitHub Release Assets
    needs: [check-version, release-gate, build-cli]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.check-version.outputs.version }}

      - name: Download all release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: build-outputs/
          pattern: release-*
          merge-multiple: true

      # Uses gh directly for the same reason the build step does: the release of
      # a tool must not depend on installing that tool first.
      - name: Finalize GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" build-outputs/* --clobber
          else
            gh release create "$VERSION" build-outputs/* \
              --title "$VERSION" --generate-notes
          fi
