# yaml-language-server: $schema=./schemas/clearcutt-config.schema.json
apiVersion: clearcutt.dev/v1
kind: ClearCuttConfig
metadata:
  name: clearcutt-reference-fleet
registry:
  host: ghcr.io
  owner: northcutted
  repository: clearcutt
  imagePrefix: clearcutt
branding:
  productName: ClearCutt
  vendor: ClearCutt
  authors: ClearCutt maintainers
site:
  title: ClearCutt Hardened Image Fleet
  pages: true
  basePath: /clearcutt-verify
  description: Fork this kit to publish your own trusted base-image fleet, catalog, policies, and app-team templates under your GitHub OIDC identities.
matrix:
  systems:
    - x86_64-linux
    - aarch64-linux
  languages:
    # ONE runtime line, built end to end. ClearCutt's product is governing image
    # estates, not publishing them, so the factory exists to prove the build path
    # is real — not to operate an image feed. java25 is the line that proves the
    # most per cell: a jlink'd minimal JRE exercises the dev, slim, and distroless
    # tier hooks (devExtra / slimOverride / distrolessOverride) against a closure
    # big enough for the purity gate to mean something, and it carries no
    # unfixable CVEs, so the fleet holds no standing vulnerability acceptances.
    #
    # The node, python, and go recipes stay in core/lib/registry.nix. They are a
    # recipe library a fork selects from by editing this list, not dead code:
    # `verify boundary-suite` evaluates every recipe so an unbuilt one cannot rot
    # silently. Governance features are demonstrated against real public images
    # (see examples/public-estate/), which is a stronger claim than demonstrating
    # them against images we built ourselves.
    - java25
  tiers:
    - dev
    - slim
    - distroless
catalog:
  releaseLimit: 10
  scanDepth: "4"
  scanAll: false
remediation:
  policy:
    productionTiers:
      - slim
      - distroless
    minimumSeverity: high
    requireRuntimeLayer: true
    requireFixedVersion: true
    epssPercentileBoostAt: 0.90
    kevBoost: true
