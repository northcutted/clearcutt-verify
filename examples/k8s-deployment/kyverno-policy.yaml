# ClearCutt Secure K8s Admission Control Policy (Kyverno)
# Paradigm: base-image provenance plus optional downstream rebase attestation gates.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: clearcutt-verify-provenance
  annotations:
    policies.kyverno.io/title: "Verify ClearCutt Signatures, Provenance, and Rebase Attestations"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/description: >
      Validates ClearCutt base-image signatures/SLSA provenance and verifies
      securely rebased downstream application images before permitting deployment.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: verify-clearcutt-base-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/northcutted/clearcutt/clearcutt-*"
          failureAction: Enforce
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github.com/northcutted/clearcutt-verify/\\.github/workflows/release\\.yml@refs/heads/main$"
          mutateDigest: true
          verifyDigest: true
          required: true

    - name: verify-clearcutt-base-provenance
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/northcutted/clearcutt/clearcutt-*"
          failureAction: Enforce
          attestations:
            - predicateType: "https://slsa.dev/provenance/v1"
              attestors:
                - entries:
                    - keyless:
                        issuer: "https://token.actions.githubusercontent.com"
                        subjectRegExp: "^https://github.com/northcutted/clearcutt-verify/\\.github/workflows/release\\.yml@refs/heads/main$"
          mutateDigest: true
          verifyDigest: true
          required: true

    # Template rule for downstream application images rebased by an enterprise
    # ClearCutt rebase-engine workflow. Replace ghcr.io/acme/* and both workflow
    # identities with your registry path and pinned CI subjects.
    - name: verify-rebased-app-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/acme/*"
          failureAction: Enforce
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github.com/acme/platform/\\.github/workflows/rebase\\.yml@refs/heads/main$"
          mutateDigest: true
          verifyDigest: true
          required: true

    - name: verify-rebased-app-attestation
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/acme/*"
          failureAction: Enforce
          attestations:
            - predicateType: "https://clearcutt.dev/attestations/rebase/v1"
              attestors:
                - entries:
                    - keyless:
                        issuer: "https://token.actions.githubusercontent.com"
                        subjectRegExp: "^https://github.com/acme/platform/\\.github/workflows/rebase\\.yml@refs/heads/main$"
              conditions:
                - all:
                    - key: "{{ rebaseDecision }}"
                      operator: Equals
                      value: "allowed"
                    - key: "{{ developerSignatureVerified }}"
                      operator: Equals
                      value: true
                    - key: "{{ developerIssuer }}"
                      operator: Equals
                      value: "https://token.actions.githubusercontent.com"
                    - key: "{{ developerIdentity }}"
                      operator: Equals
                      value: "https://github.com/acme/payments/.github/workflows/release.yml@refs/heads/main"
          mutateDigest: true
          verifyDigest: true
          required: true
