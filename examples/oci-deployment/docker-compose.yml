# ClearCutt app deployment example.
#
# The service image below is an application image built from a ClearCutt base
# using examples/clearcutt-template-java/Dockerfile or an equivalent app-team
# Dockerfile. Do not deploy the base runtime image itself as the application.

version: "3.8"

services:
  payments-api:
    build:
      context: ../clearcutt-template-java
    image: ghcr.io/acme/payments-api:1.0.0
    container_name: payments-api
    ports:
      - "8080:8080"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      org.clearcutt.base: java21-distroless
      org.clearcutt.certify: "clearcutt-verify certify payments-api.tar --base java21-distroless --policy certification-policy.yaml --image-ref ghcr.io/acme/payments-api@sha256:..."
    restart: unless-stopped
